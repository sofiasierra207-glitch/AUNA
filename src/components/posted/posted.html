<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Página para probar el componente solo -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posted component</title>

    <!-- Fuentes y estilos del componente -->
    <link rel="stylesheet" href="../../assets/fonts/fonts.css">

            openPostedModal();
